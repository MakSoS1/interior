name: Universal Adapter APK
on:
  workflow_dispatch:
  push:
    branches: [implementation/universal-import-lighting]
    paths: [ci/request-adapter-run.txt, .github/workflows/universal-adapter.yml]
  pull_request:
    paths: [app/**, tools/**, .github/workflows/universal-adapter.yml]
concurrency:
  group: adapter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Android SDK and model generators
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
          python -m pip install -r scripts/requirements-reference.txt
          python scripts/generate_demo.py --output app/src/main/assets/demo_kitchen.glb
          python scripts/build_reference_kitchen.py --output app/src/main/assets/reference_kitchen.glb --manifest assets/reference_kitchen_manifest.json
          python scripts/split_reference_kitchen.py --output-dir app/src/main/assets --manifest assets/placement_groups_manifest.json
          python scripts/build_fridge_module.py --output app/src/main/assets/fridge_opposite_wall.glb --manifest assets/fridge_module_manifest.json
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python -m unittest discover -s tools -p 'test_*.py' -v
          python tools/make_demo_pack.py
      - name: Test and compile APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build identity and signature verification
        run: |
          mkdir -p deliver
          cp app/build/outputs/apk/debug/app-debug.apk deliver/Interior-AR-Adapter.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk deliver/Interior-AR-Adapter-test.apk
          sha256sum deliver/*.apk > deliver/SHA256SUMS.txt
          git rev-parse HEAD > deliver/COMMIT.txt
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --print-certs deliver/Interior-AR-Adapter.apk > deliver/SIGNATURE.txt
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump badging deliver/Interior-AR-Adapter.apk > deliver/APK_METADATA.txt
          cp -r tools deliver/adapter-tools
          cp -r dist/. deliver/
          cp docs/portable-adapter-and-lighting.md deliver/README.ru.md
      - uses: actions/upload-artifact@v4
        with:
          name: interior-adapter-delivery
          path: deliver/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-adapter-test-reports
          path: |
            app/build/test-results/
            app/build/reports/
          if-no-files-found: ignore
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install distro Blender and record exact version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          mkdir -p blender-results
          blender --version > blender-results/version.txt
      - name: Export two real Blender collections
        run: |
          blender --background --factory-startup --python tools/blender_smoke.py > blender-results/export.txt 2>&1
          cat blender-results/export.txt
          grep BLENDER_ADAPTER_SMOKE_OK blender-results/export.txt
          python3 tools/interior_adapter.py validate dist/blender_smoke.interior.zip
          cp dist/blender_smoke.interior.zip blender-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-adapter-blender
          path: blender-results/
          if-no-files-found: ignore
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: interior-adapter-delivery
          path: deliver
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-metrics -no-snapshot
          script: bash deliver/adapter-tools/run_apk_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-adapter-emulator
          path: emulator-results/
          if-no-files-found: ignore
