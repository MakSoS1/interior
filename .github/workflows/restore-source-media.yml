name: Restore original kitchen media
on:
  push:
    branches: ['feat/**']
    paths:
      - 'reference/source/video_b64/**'
      - 'scripts/reconstruct_original_video.py'
      - '.github/workflows/restore-source-media.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-home-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Assemble original byte-identical video and verify original photo
        run: python3 scripts/reconstruct_original_video.py
      - name: Commit original MP4 if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/source/room_walkthrough_original.mp4
          if git diff --staged --quiet; then
            echo "Original video already committed and unchanged"
          else
            git commit -m "assets: add verified original walkthrough video (SHA256 checked)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
