name: Interior Adapter APK
on:
  push:
    branches: ['feature/asset-adapter-lighting-v3']
    paths-ignore: ['.github/workflows/adapter-development.yml']
  workflow_dispatch:
concurrency:
  group: adapter-diagnostics-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Adapter unit tests (system Python)
        run: /usr/bin/python3 -m unittest discover -s adapter/tests -p 'test_*.py' -v
      - name: Install Blender and its system Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/blender --version
      - name: Real Blender groups and metric unit roundtrip
        run: |
          mkdir -p build/adapter
          env -i HOME="$HOME" PATH=/usr/bin:/bin LANG=C.UTF-8 /usr/bin/blender -b --factory-startup --python-exit-code 1 --python adapter/tests/blender_roundtrip.py -- "$PWD/build/adapter"
          test -s build/adapter/two-groups.interior.zip
          test -s build/adapter/blender-roundtrip.json
      - name: Package installable addon and complete source snapshot
        run: |
          (cd adapter && zip -r ../build/adapter/interior_ar_export.zip interior_ar_export -x '*__pycache__*')
          cp adapter/pack_glb.py docs/adapter/README.md docs/adapter/format.md build/adapter/
          git archive --format=zip HEAD -o build/adapter/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: interior-blender-adapter
          path: build/adapter/
          retention-days: 14
  build:
    needs: blender
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: interior-blender-adapter
          path: build/adapter
      - name: Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -path '*/bin/sdkmanager' | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Generate kitchen assets and copy real Blender test package
        run: |
          python -m pip install -r scripts/requirements-reference.txt
          python scripts/generate_demo.py --output app/src/main/assets/demo_kitchen.glb
          python scripts/build_reference_kitchen.py --output app/src/main/assets/reference_kitchen.glb --manifest assets/reference_kitchen_manifest.json
          python scripts/split_reference_kitchen.py --output-dir app/src/main/assets --manifest assets/placement_groups_manifest.json
          python scripts/build_fridge_module.py --output app/src/main/assets/fridge_opposite_wall.glb --manifest assets/fridge_module_manifest.json
          cp build/adapter/two-groups.interior.zip app/src/main/assets/adapter_demo.interior.zip
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test and build APK
        run: |
          set -o pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build/android-build.log
      - name: APK identity
        run: |
          git rev-parse HEAD > app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: interior-adapter-apk
          path: |
            app/build/outputs/apk/debug/
            app/build/outputs/apk/androidTest/debug/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-adapter-tests
          path: |
            app/build/reports/
            app/build/test-results/
            build/android-build.log
          if-no-files-found: ignore
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: interior-adapter-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install exact APK and exercise actual native preview on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/adapter-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-adapter-emulator-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
